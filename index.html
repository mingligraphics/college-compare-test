// Prefer the right of the trigger; flip left or below when space is limited.
function positionFilterMenu(menu){
 const panel=menu.querySelector('.filter-panel');
 const trigger=menu.querySelector('summary').getBoundingClientRect(),gap=8,edge=12;
 const width=panel.getBoundingClientRect().width,height=panel.getBoundingClientRect().height;
 let left=trigger.right+gap,top=trigger.top;
 if(left+width>innerWidth-edge){
  if(trigger.left-gap-width>=edge)left=trigger.left-gap-width;
  else{left=trigger.left;top=trigger.bottom+gap}
 }
 left=Math.max(edge,Math.min(left,innerWidth-width-edge));
 top=Math.max(edge,Math.min(top,innerHeight-height-edge));
 panel.style.setProperty('--filter-left',left+'px');panel.style.setProperty('--filter-top',top+'px');
}
